# 클러스터 설정
cluster-enabled yes
cluster-config-file nodes.conf
cluster-node-timeout 5000

# 보안 설정
requirepass admin
masterauth admin

# 네트워크 설정
bind 0.0.0.0
protected-mode no

# 데이터 저장 설정
appendonly yes
appendfsync everysec
dir /data

# 로그 설정
loglevel notice

# 기타 설정
tcp-keepalive 300
timeout 0

# 클러스터 외부 접근 설정
cluster-announce-ip localhost
