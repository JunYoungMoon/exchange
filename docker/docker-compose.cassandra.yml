      - CASSANDRA_CLUSTER_NAME=exchange_cluster
      - CASSANDRA_DC=DC1
      - CASSANDRA_RACK=RACK1
      - CASSANDRA_ENDPOINT_SNITCH=GossipingPropertyFileSnitch
      - CASSANDRA_USERNAME=default
      - CASSANDRA_PASSWORD=1234
      - LOCAL_JMX=no
    volumes:
      - ../exchange_data/cassandra_data_dc1_node2:/var/lib/cassandra
      # - ./cassandra.yaml:/etc/cassandra/cassandra.yaml
      - ./jmxremote.password:/etc/cassandra/jmxremote.password
