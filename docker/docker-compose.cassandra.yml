  # 데이터센터 1의 노드 1
  cassandra-dc1-node1:
    image: cassandra:latest
    container_name: cassandra-dc1-node1
    restart: unless-stopped
    ports:
      - "9042:9042"
    environment:
      - MAX_HEAP_SIZE=512M
      - HEAP_NEWSIZE=100M
      # - CASSANDRA_SEEDS=cassandra-dc1-node1,cassandra-dc1-node2,cassandra-dc2-node1,cassandra-dc2-node2
      - CASSANDRA_SEEDS=cassandra-dc1-node1,cassandra-dc1-node2
      - CASSANDRA_CLUSTER_NAME=exchange_cluster
      - CASSANDRA_DC=DC1
      - CASSANDRA_RACK=RACK1
      - CASSANDRA_ENDPOINT_SNITCH=GossipingPropertyFileSnitch
      - CASSANDRA_USERNAME=default
      - CASSANDRA_PASSWORD=1234
      - LOCAL_JMX=no
    volumes:
      - ../exchange_data/cassandra_data_dc1_node1:/var/lib/cassandra
      - ./cassandra-docker.yaml:/etc/cassandra/cassandra.yaml
      - ./jmxremote.password:/etc/cassandra/jmxremote.password
    networks:
      - cdc-network

  # 데이터센터 1의 노드 2
  cassandra-dc1-node2:
